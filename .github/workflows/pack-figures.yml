name: Package approved figures
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Two-page diagnosis, direct candidate experiment, or full legacy packaging
        type: choice
        default: diagnostic
        options:
          - diagnostic
          - candidate
          - full
permissions:
  contents: read
  actions: read
concurrency:
  group: package-approved-figures
  cancel-in-progress: false
jobs:
  package:
    runs-on: ${{ inputs.mode == 'candidate' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.mode == 'candidate' && 90 || 40 }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Fetch the approved existing bake on the runner only
        run: |
          set -euo pipefail
          gh api repos/adhanke-star/the-civil-war/actions/runs/37347072866 --jq '[.head_sha,.conclusion] | join(" ")' > "$RUNNER_TEMP/source.txt"
          test "$(cat "$RUNNER_TEMP/source.txt")" = '820846fdc2fe11782a36b219220edcb16e222f92 success'
          gh run download 37347072866 --repo adhanke-star/the-civil-war -n bake-33 -D "$RUNNER_TEMP/approved-bake"
      - name: Pinned Khronos encoder (Apache-2.0; build tool only)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ktx.tar.bz2" https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.tar.bz2
          echo "a8781bad05f9624edbf910b7f258cd0a4ba7d3e63b49ecc0a0ab440bf6a0a245  $RUNNER_TEMP/ktx.tar.bz2" | sha256sum -c -
          mkdir "$RUNNER_TEMP/ktx"
          tar -xf "$RUNNER_TEMP/ktx.tar.bz2" -C "$RUNNER_TEMP/ktx" --strip-components=1
          echo "$RUNNER_TEMP/ktx/bin" >> "$GITHUB_PATH"
      - name: Pinned direct BC7 C++ encoder (MIT; no ISPC)
        if: inputs.mode == 'candidate'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bc7-source.tar.gz" https://codeload.github.com/richgel999/bc7enc_rdo/tar.gz/b9438627eef73a1157e84201b6fa6eb2ffd6d9f0
          echo "bbb33d1dbb6178a3a2c044956c3cc0b8ea9fc2f2903824379dd86f87d53b64c6  $RUNNER_TEMP/bc7-source.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/bc7-source"
          tar -xf "$RUNNER_TEMP/bc7-source.tar.gz" -C "$RUNNER_TEMP/bc7-source" --strip-components=1
          cmake -S "$RUNNER_TEMP/bc7-source" -B "$RUNNER_TEMP/bc7-build" -DCMAKE_BUILD_TYPE=Release -DSUPPORT_BC7E=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build "$RUNNER_TEMP/bc7-build" --parallel 2
          echo "BC7_ENCODER=$RUNNER_TEMP/bc7-build/bc7enc" >> "$GITHUB_ENV"
          gh run download 37374456139 --repo adhanke-star/the-civil-war -n compression-review -D "$RUNNER_TEMP/historical-uastc"
          echo "HISTORICAL_REVIEW=$RUNNER_TEMP/historical-uastc" >> "$GITHUB_ENV"
      - name: Preserve approved identities; encode only the selected mode
        env:
          PACK_MODE: ${{ inputs.mode }}
        run: |
          if [ "$PACK_MODE" = diagnostic ]; then
            node tools/bake/compress.mjs "$RUNNER_TEMP/approved-bake/atlas" .out/figure-pack --diagnostic
          elif [ "$PACK_MODE" = candidate ]; then
            node tools/bake/compress.mjs "$RUNNER_TEMP/approved-bake/atlas" .out/figure-pack --candidate
          elif [ "$PACK_MODE" = full ]; then
            node tools/bake/compress.mjs "$RUNNER_TEMP/approved-bake/atlas" .out/figure-pack
          else
            echo 'Unknown package mode' >&2
            exit 1
          fi
      - name: GPU readback against every approved PNG and meaningful broken controls
        run: node tools/bake/review-compression.mjs "$RUNNER_TEMP/approved-bake/atlas" .out/figure-pack
      - name: Optimized atlases and manifest only
        if: success() && inputs.mode == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: approved-figures-ktx2
          path: |
            .out/figure-pack/*.ktx2
            .out/figure-pack/soldier.json
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Small quality report and comparison sheets
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compression-review
          path: |
            .out/figure-pack/compression.json
            .out/figure-pack/quality.json
            .out/figure-pack/compression-*.png
          retention-days: 7
          if-no-files-found: warn
