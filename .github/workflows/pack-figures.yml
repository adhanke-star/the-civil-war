          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          const m=JSON.parse(fs.readFileSync('.out/scene-allocation/transport-manifest.json'));
          const run=process.env.GITHUB_RUN_ID;assert.match(run,/^[0-9]+$/);
          const wanted=['scene-original-manifest',...m.groups.map(g=>'scene-original-'+String(g.index).padStart(2,'0'))];
          const receipt={run,sha:process.env.GITHUB_SHA,wanted,complete:false,artifacts:[],missing:[],extra:[],failure:null};
          try{
            const data=JSON.parse(execFileSync('gh',['api',`repos/adhanke-star/the-civil-war/actions/runs/${run}/artifacts?per_page=100`],{maxBuffer:1000000}));
            receipt.artifacts=data.artifacts;
            receipt.missing=wanted.filter(n=>!data.artifacts.some(a=>a.name===n));
            receipt.extra=data.artifacts.filter(a=>!wanted.includes(a.name)).map(a=>a.name);
            assert.equal(data.total_count,wanted.length);assert.equal(data.artifacts.length,wanted.length);
            assert.deepEqual(receipt.missing,[]);assert.deepEqual(receipt.extra,[]);
            assert.equal(new Set(data.artifacts.map(a=>a.name)).size,wanted.length);
            for(const a of data.artifacts){assert.ok(a.size_in_bytes<99000000);assert.equal(a.expired,false);assert.equal(String(a.workflow_run.id),run);assert.equal(a.workflow_run.head_sha,process.env.GITHUB_SHA);assert.match(a.digest,/^sha256:[a-f0-9]{64}$/);}
            receipt.complete=true;
          }catch(error){receipt.failure=String(error.message);console.error(receipt.failure);process.exitCode=1;}
          finally{fs.writeFileSync('.out/scene-allocation/transport-uploads.json',JSON.stringify(receipt),{flag:'wx'});console.log('EXACT ORIGINAL TRANSPORT UPLOADS',JSON.stringify(receipt));}
