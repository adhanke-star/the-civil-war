name: Package approved figures
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Current two-army diagnosis, or retained legacy modes
        type: choice
        default: current
        options:
          - current
          - cs-close
          - cs-hybrid
          - scene
          - scene-transport
          - badge-observations
          - badge-level10
          - badge-missionary
          - badge-missionary-revision
          - badge-revisions
          - badge-promotion
          - badge-promotion-relief
          - diagnostic
          - candidate
          - full
          - residency
      inactive:
        description: Scene mode only; diagnostic inactive figure buffer reclamation
        type: boolean
        default: false
      partition:
        description: Scene mode only; diagnostic lossless Uint16 terrain partitions
        type: boolean
        default: false
      scene_routes:
        description: Scene mode only; complete qualified two-route observation
        type: choice
        default: current-png
        options:
          - current-png
          - qualified-both
      scene_completion:
        description: Scene mode only; approved diagnostic candidate completion before fallback
        type: choice
        default: no-finish
        options:
          - no-finish
          - native-finish
permissions:
  contents: read
  actions: read
concurrency:
  group: package-approved-figures
  cancel-in-progress: false
jobs:
  package:
    if: inputs.mode != 'scene-transport' && inputs.mode != 'badge-observations' && inputs.mode != 'badge-level10' && inputs.mode != 'badge-missionary' && inputs.mode != 'badge-missionary-revision' && inputs.mode != 'badge-revisions' && inputs.mode != 'badge-promotion' && inputs.mode != 'badge-promotion-relief'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (inputs.mode == 'candidate' || inputs.mode == 'current' || inputs.mode == 'cs-close' || inputs.mode == 'cs-hybrid' || (inputs.mode == 'scene' && inputs.scene_routes == 'qualified-both')) && 90 || 40 }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
        if: inputs.mode != 'residency'
      - name: Fetch the approved existing bake on the runner only
        if: inputs.mode != 'scene'
        run: |
          set -euo pipefail
          if [ '${{ inputs.mode }}' = current ] || [ '${{ inputs.mode }}' = cs-close ] || [ '${{ inputs.mode }}' = cs-hybrid ]; then
            gh api repos/adhanke-star/the-civil-war/actions/runs/38186582847 --jq '.conclusion' > "$RUNNER_TEMP/source.txt"
            test "$(cat "$RUNNER_TEMP/source.txt")" = success
            gh run download 38186582847 --repo adhanke-star/the-civil-war -n bake-cs-34 -D "$RUNNER_TEMP/current-cs-bake"
          else
            gh api repos/adhanke-star/the-civil-war/actions/runs/37347072866 --jq '[.head_sha,.conclusion] | join(" ")' > "$RUNNER_TEMP/source.txt"
            test "$(cat "$RUNNER_TEMP/source.txt")" = '820846fdc2fe11782a36b219220edcb16e222f92 success'
            gh run download 37347072866 --repo adhanke-star/the-civil-war -n bake-33 -D "$RUNNER_TEMP/approved-bake"
          fi
      - name: Pinned Khronos encoder (Apache-2.0; build tool only)
        if: inputs.mode != 'residency' && inputs.mode != 'scene'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ktx.tar.bz2" https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.tar.bz2
          echo "a8781bad05f9624edbf910b7f258cd0a4ba7d3e63b49ecc0a0ab440bf6a0a245  $RUNNER_TEMP/ktx.tar.bz2" | sha256sum -c -
          mkdir "$RUNNER_TEMP/ktx"
          tar -xf "$RUNNER_TEMP/ktx.tar.bz2" -C "$RUNNER_TEMP/ktx" --strip-components=1
          echo "$RUNNER_TEMP/ktx/bin" >> "$GITHUB_PATH"
      - name: Pinned direct BC7 C++ encoder (MIT; no ISPC)
        if: inputs.mode == 'candidate' || inputs.mode == 'current'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bc7-source.tar.gz" https://codeload.github.com/richgel999/bc7enc_rdo/tar.gz/b9438627eef73a1157e84201b6fa6eb2ffd6d9f0
          echo "bbb33d1dbb6178a3a2c044956c3cc0b8ea9fc2f2903824379dd86f87d53b64c6  $RUNNER_TEMP/bc7-source.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/bc7-source"
          tar -xf "$RUNNER_TEMP/bc7-source.tar.gz" -C "$RUNNER_TEMP/bc7-source" --strip-components=1
          # Pinned ert.h omits <cstdint>; GCC 13 no longer supplies it transitively.
          # Force-include the standard header without modifying the pinned source or codec settings.
          cmake -S "$RUNNER_TEMP/bc7-source" -B "$RUNNER_TEMP/bc7-build" -DCMAKE_BUILD_TYPE=Release -DSUPPORT_BC7E=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 '-DCMAKE_CXX_FLAGS=-include cstdint'
          cmake --build "$RUNNER_TEMP/bc7-build" --parallel 2
          echo "BC7_ENCODER=$RUNNER_TEMP/bc7-build/bc7enc" >> "$GITHUB_ENV"
          if [ '${{ inputs.mode }}' = candidate ]; then
            gh run download 37374456139 --repo adhanke-star/the-civil-war -n compression-review -D "$RUNNER_TEMP/historical-uastc"
            echo "HISTORICAL_REVIEW=$RUNNER_TEMP/historical-uastc" >> "$GITHUB_ENV"
          fi
      - name: Preserve approved identities; encode only the selected mode
        if: inputs.mode != 'residency' && inputs.mode != 'scene'
        env:
          PACK_MODE: ${{ inputs.mode }}
        run: |
          if [ "$PACK_MODE" = current ]; then
            node tools/bake/current-compression.mjs "$RUNNER_TEMP/current-cs-bake/atlas"
          elif [ "$PACK_MODE" = cs-close ]; then
            node tools/bake/current-compression.mjs "$RUNNER_TEMP/current-cs-bake/atlas" --cs-close
          elif [ "$PACK_MODE" = cs-hybrid ]; then
            node tools/test-atlas-compression.mjs
            node tools/test-atlas-compression.mjs --prove-fail
            node tools/test-current-compression.mjs
            node tools/test-current-compression.mjs --prove-fail
            node tools/bake/current-compression.mjs "$RUNNER_TEMP/current-cs-bake/atlas" --hybrid
          elif [ "$PACK_MODE" = diagnostic ]; then
            node tools/bake/compress.mjs "$RUNNER_TEMP/approved-bake/atlas" .out/figure-pack --diagnostic
          elif [ "$PACK_MODE" = candidate ]; then
            node tools/bake/compress.mjs "$RUNNER_TEMP/approved-bake/atlas" .out/figure-pack --candidate
          elif [ "$PACK_MODE" = full ]; then
            node tools/bake/compress.mjs "$RUNNER_TEMP/approved-bake/atlas" .out/figure-pack
          else
            echo 'Unknown package mode' >&2
            exit 1
          fi
      - name: GPU readback against every approved PNG and meaningful broken controls
        if: inputs.mode != 'residency' && inputs.mode != 'current' && inputs.mode != 'cs-close' && inputs.mode != 'cs-hybrid' && inputs.mode != 'scene'
        run: node tools/bake/review-compression.mjs "$RUNNER_TEMP/approved-bake/atlas" .out/figure-pack
      - name: Current five-page actual GPU readback, mips 0/1/2, unchanged quality thresholds
        if: inputs.mode == 'current' || inputs.mode == 'cs-close' || inputs.mode == 'cs-hybrid'
        run: node tools/bake/review-current-compression.mjs
      - name: Current whole-scene allocation observation, both armies and all campaign phases
        id: scene
        if: inputs.mode == 'scene'
        env:
          SCENE_INACTIVE: ${{ inputs.inactive }}
          SCENE_PARTITION: ${{ inputs.partition }}
          SCENE_ROUTES: ${{ inputs.scene_routes }}
          SCENE_COMPLETION: ${{ inputs.scene_completion }}
        run: |
          node tools/test-scene-allocation.mjs
          node tools/test-scene-allocation.mjs --prove-fail
          node tools/test-inactive-figures.mjs
          node tools/test-inactive-figures.mjs --prove-fail
          node tools/test-terrain-partition.mjs
          node tools/test-terrain-partition.mjs --prove-fail
          node tools/bake/review-scene-allocation.mjs
      - name: Scene allocation report only, no assets or adoption
        if: always() && inputs.mode == 'scene'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scene-allocation
          path: |
            .out/scene-allocation/report.json
            .out/scene-allocation/report-overflow.json.gz
            .out/scene-allocation/*.png
          retention-days: 7
          if-no-files-found: warn
      - name: Bounded scene matrix group 00
        if: always() && inputs.mode == 'scene' && inputs.scene_routes == 'qualified-both' && fromJSON(steps.scene.outputs.matrix_groups || '0') > 0
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scene-matrix-00
          path: ${{ steps.scene.outputs.matrix_root }}/matrix-00/*
          retention-days: 7
          if-no-files-found: error
      - name: Bounded scene matrix group 01
        if: always() && inputs.mode == 'scene' && inputs.scene_routes == 'qualified-both' && fromJSON(steps.scene.outputs.matrix_groups || '0') > 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scene-matrix-01
          path: ${{ steps.scene.outputs.matrix_root }}/matrix-01/*
          retention-days: 7
          if-no-files-found: error
      - name: Bounded scene matrix group 02
        if: always() && inputs.mode == 'scene' && inputs.scene_routes == 'qualified-both' && fromJSON(steps.scene.outputs.matrix_groups || '0') > 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scene-matrix-02
          path: ${{ steps.scene.outputs.matrix_root }}/matrix-02/*
          retention-days: 7
          if-no-files-found: error
      - name: Bounded scene matrix group 03
        if: always() && inputs.mode == 'scene' && inputs.scene_routes == 'qualified-both' && fromJSON(steps.scene.outputs.matrix_groups || '0') > 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scene-matrix-03
          path: ${{ steps.scene.outputs.matrix_root }}/matrix-03/*
          retention-days: 7
          if-no-files-found: error
      - name: Bounded scene matrix group 04
        if: always() && inputs.mode == 'scene' && inputs.scene_routes == 'qualified-both' && fromJSON(steps.scene.outputs.matrix_groups || '0') > 4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scene-matrix-04
          path: ${{ steps.scene.outputs.matrix_root }}/matrix-04/*
          retention-days: 7
          if-no-files-found: error
      - name: Bounded scene matrix group 05
        if: always() && inputs.mode == 'scene' && inputs.scene_routes == 'qualified-both' && fromJSON(steps.scene.outputs.matrix_groups || '0') > 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scene-matrix-05
          path: ${{ steps.scene.outputs.matrix_root }}/matrix-05/*
          retention-days: 7
          if-no-files-found: error
      - name: Bounded scene matrix group 06
        if: always() && inputs.mode == 'scene' && inputs.scene_routes == 'qualified-both' && fromJSON(steps.scene.outputs.matrix_groups || '0') > 6
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scene-matrix-06
          path: ${{ steps.scene.outputs.matrix_root }}/matrix-06/*
          retention-days: 7
          if-no-files-found: error
      - name: Bounded scene matrix group 07
        if: always() && inputs.mode == 'scene' && inputs.scene_routes == 'qualified-both' && fromJSON(steps.scene.outputs.matrix_groups || '0') > 7
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scene-matrix-07
          path: ${{ steps.scene.outputs.matrix_root }}/matrix-07/*
          retention-days: 7
          if-no-files-found: error
      - name: Bounded scene matrix group 08
        if: always() && inputs.mode == 'scene' && inputs.scene_routes == 'qualified-both' && fromJSON(steps.scene.outputs.matrix_groups || '0') > 8
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scene-matrix-08
          path: ${{ steps.scene.outputs.matrix_root }}/matrix-08/*
          retention-days: 7
          if-no-files-found: error
      - name: Bounded scene matrix group 09
        if: always() && inputs.mode == 'scene' && inputs.scene_routes == 'qualified-both' && fromJSON(steps.scene.outputs.matrix_groups || '0') > 9
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scene-matrix-09
          path: ${{ steps.scene.outputs.matrix_root }}/matrix-09/*
          retention-days: 7
          if-no-files-found: error
      - name: Bounded scene matrix group 10
        if: always() && inputs.mode == 'scene' && inputs.scene_routes == 'qualified-both' && fromJSON(steps.scene.outputs.matrix_groups || '0') > 10
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scene-matrix-10
          path: ${{ steps.scene.outputs.matrix_root }}/matrix-10/*
          retention-days: 7
          if-no-files-found: error
      - name: Bounded scene matrix group 11
        if: always() && inputs.mode == 'scene' && inputs.scene_routes == 'qualified-both' && fromJSON(steps.scene.outputs.matrix_groups || '0') > 11
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scene-matrix-11
          path: ${{ steps.scene.outputs.matrix_root }}/matrix-11/*
          retention-days: 7
          if-no-files-found: error
      - name: Bounded scene matrix group 12
        if: always() && inputs.mode == 'scene' && inputs.scene_routes == 'qualified-both' && fromJSON(steps.scene.outputs.matrix_groups || '0') > 12
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scene-matrix-12
          path: ${{ steps.scene.outputs.matrix_root }}/matrix-12/*
          retention-days: 7
          if-no-files-found: error
      - name: Bounded scene matrix group 13
        if: always() && inputs.mode == 'scene' && inputs.scene_routes == 'qualified-both' && fromJSON(steps.scene.outputs.matrix_groups || '0') > 13
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scene-matrix-13
          path: ${{ steps.scene.outputs.matrix_root }}/matrix-13/*
          retention-days: 7
          if-no-files-found: error
      - name: Bounded scene matrix group 14
        if: always() && inputs.mode == 'scene' && inputs.scene_routes == 'qualified-both' && fromJSON(steps.scene.outputs.matrix_groups || '0') > 14
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scene-matrix-14
          path: ${{ steps.scene.outputs.matrix_root }}/matrix-14/*
          retention-days: 7
          if-no-files-found: error
      - name: Bounded scene matrix group 15
        if: always() && inputs.mode == 'scene' && inputs.scene_routes == 'qualified-both' && fromJSON(steps.scene.outputs.matrix_groups || '0') > 15
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scene-matrix-15
          path: ${{ steps.scene.outputs.matrix_root }}/matrix-15/*
          retention-days: 7
          if-no-files-found: error
      - name: Preserve unaccepted whole scene bytes if bounded transport refuses
        if: always() && inputs.mode == 'scene' && inputs.scene_routes == 'qualified-both' && steps.scene.outputs.matrix_transport_failure == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scene-matrix-forensic
          path: ${{ steps.scene.outputs.matrix_forensic_root }}/*
          retention-days: 7
          if-no-files-found: error
      - name: Verify actual scene matrix ZIP set, source and bounded transport
        if: always() && inputs.mode == 'scene' && inputs.scene_routes == 'qualified-both'
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';
          const run=process.env.GITHUB_RUN_ID,sha=process.env.GITHUB_SHA,root='.out/scene-allocation';
          const receipt={run,sha,complete:false,wanted:[],artifacts:[],failure:null};
          try{
            const m=JSON.parse(fs.readFileSync(root+'/report.json'));assert.equal(m.toolSha,sha);assert.equal(String(m.run),run);
            receipt.wanted=['scene-allocation',...(m.groups||[]).map(g=>'scene-matrix-'+String(g.index).padStart(2,'0')),...(m.transportFailure?.policy?.includes('forensic artifact')?['scene-matrix-forensic']:[])];
            const data=JSON.parse(execFileSync('gh',['api',`repos/adhanke-star/the-civil-war/actions/runs/${run}/artifacts?per_page=100`],{maxBuffer:1000000}));receipt.artifacts=data.artifacts;
            assert.equal(data.total_count,receipt.wanted.length);assert.equal(new Set(data.artifacts.map(a=>a.name)).size,receipt.wanted.length);
            assert.deepEqual(data.artifacts.map(a=>a.name).sort(),receipt.wanted.slice().sort());
            for(const a of data.artifacts){assert.ok(a.size_in_bytes<99000000);assert.equal(a.expired,false);assert.equal(String(a.workflow_run.id),run);assert.equal(a.workflow_run.head_sha,sha);assert.match(a.digest,/^sha256:[a-f0-9]{64}$/);}
            assert.ok(!m.transportFailure);receipt.complete=true;
          }catch(error){receipt.failure=String(error?.message??error);process.exitCode=1;}
          finally{fs.mkdirSync(root,{recursive:true});fs.writeFileSync(root+'/matrix-uploads.json',JSON.stringify(receipt),{flag:'wx'});console.log('SCENE MATRIX UPLOADS',JSON.stringify(receipt));}
          JS
      - name: Actual bounded matrix upload receipt
        if: always() && inputs.mode == 'scene' && inputs.scene_routes == 'qualified-both'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scene-matrix-uploads
          path: .out/scene-allocation/matrix-uploads.json
          retention-days: 7
          if-no-files-found: error
      - name: Current diagnostic reports and five numbered comparison images only
        if: always() && inputs.mode == 'current'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-compression-review
          path: |
            .out/current-compression/compression.json
            .out/current-compression/quality.json
            .out/current-compression/current-compression-*.png
          retention-days: 7
          if-no-files-found: warn
      - name: CS close qualification reports and every numbered frame comparison
        if: always() && (inputs.mode == 'cs-close' || inputs.mode == 'cs-hybrid')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cs-close-qualification-review
          path: |
            .out/current-compression/compression.json
            .out/current-compression/quality.json
            .out/current-compression/soldier-source.json
            .out/current-compression/cs-close-[0-9][0-9][0-9].png
          retention-days: 7
          if-no-files-found: warn
      - name: Qualified close ASTC files only; no adoption or release approval
        if: success() && inputs.mode == 'cs-close'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cs-close-qualified-astc
          path: |
            .out/current-compression/*-astc.ktx2
            .out/current-compression/soldier-source.json
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Qualified mixed close files only; no adoption or release approval
        if: success() && inputs.mode == 'cs-hybrid'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cs-close-qualified-hybrid
          path: .out/current-compression/qualified-hybrid/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Bind the historical full original-PNG report and assess residency only
        if: inputs.mode == 'residency'
        run: |
          set -euo pipefail
          gh api repos/adhanke-star/the-civil-war/actions/runs/37360904656 --jq '[.head_sha,.conclusion] | join(" ")' > "$RUNNER_TEMP/historical-source.txt"
          test "$(cat "$RUNNER_TEMP/historical-source.txt")" = '3f439b0d326d0a27d7a46a599751890a63ed2afc failure'
          gh run download 37360904656 --repo adhanke-star/the-civil-war -n compression-review -D "$RUNNER_TEMP/full-pack-review"
          node tools/test-residency.mjs
          node tools/test-residency.mjs --prove-fail
          node tools/bake/estimate-residency.mjs "$RUNNER_TEMP/approved-bake/atlas" "$RUNNER_TEMP/full-pack-review/compression.json" .out/figure-residency/report.json
      - name: Small report only; no source PNG or optimized asset upload
        if: always() && inputs.mode == 'residency'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: figure-residency
          path: .out/figure-residency/report.json
          retention-days: 7
          if-no-files-found: warn
      - name: Optimized atlases and manifest only
        if: success() && inputs.mode == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: approved-figures-ktx2
          path: |
            .out/figure-pack/*.ktx2
            .out/figure-pack/soldier.json
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Small quality report and comparison sheets
        if: always() && inputs.mode != 'residency' && inputs.mode != 'current' && inputs.mode != 'cs-close' && inputs.mode != 'cs-hybrid' && inputs.mode != 'scene'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compression-review
          path: |
            .out/figure-pack/compression.json
            .out/figure-pack/quality.json
            .out/figure-pack/compression-*.png
          retention-days: 7
          if-no-files-found: warn

  scene-transport:
    if: inputs.mode == 'scene-transport'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify original-byte transport controls
        run: |
          node tools/test-current-compression.mjs
          node tools/test-current-compression.mjs --prove-fail
      - name: Split retained failed evidence only; no browser or simulation
        id: split
        run: node tools/bake/review-current-compression.mjs --transport-failed-scene
      - name: Original union manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scene-original-manifest
          path: .out/scene-allocation/transport-manifest.json
          retention-days: 7
          if-no-files-found: error
      - name: Original byte group 00
        if: always() && steps.split.outcome == 'success' && fromJSON(steps.split.outputs.groups || '0') > 0
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scene-original-00
          path: ${{ steps.split.outputs.root }}/transport-00/*
          retention-days: 7
