  badge-observations:
    if: inputs.mode == 'badge-observations' || inputs.mode == 'badge-level10' || inputs.mode == 'badge-missionary' || inputs.mode == 'badge-missionary-revision' || inputs.mode == 'badge-revisions' || inputs.mode == 'badge-promotion' || inputs.mode == 'badge-promotion-relief'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.mode == 'badge-promotion' && 75 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.mode == 'badge-level10' && '[3]' || (inputs.mode == 'badge-missionary' || inputs.mode == 'badge-missionary-revision' || inputs.mode == 'badge-promotion' || inputs.mode == 'badge-promotion-relief') && '[1]' || '[1,2,3]') }}
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host --init
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify pinned native browser runtime
        run: |
          node --input-type=module -e "
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {chromium} from 'playwright';
          const lock=JSON.parse(fs.readFileSync('package-lock.json'));
          assert.equal(lock.packages['node_modules/playwright'].version,'1.63.0');
          assert.equal(JSON.parse(fs.readFileSync('node_modules/playwright/package.json')).version,'1.63.0');
          fs.accessSync(chromium.executablePath(),fs.constants.X_OK);
          "
      - name: Play two actual finite tactics to natural completion and persist
        if: inputs.mode == 'badge-observations'
        run: node tools/test.mjs --badge-observations --badge-shard=${{ matrix.shard }}
      - name: Legal level10 through eight original spare-card sales
        if: inputs.mode == 'badge-level10'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/test.mjs --badge-level10
      - name: Missionary Ridge only after demonstrated terminal-step repair
        if: inputs.mode == 'badge-missionary'
        run: node tools/test.mjs --badge-missionary
      - name: One approved legal revision per completed group
        if: inputs.mode == 'badge-revisions'
        run: node tools/test.mjs --badge-revisions --badge-shard=${{ matrix.shard }}
      - name: One approved Missionary revision after the completed first observation
        if: inputs.mode == 'badge-missionary-revision'
        run: node tools/test.mjs --badge-missionary-revision
      - name: Continue original Bronze brigade through ordinary Camp and natural battles
        if: inputs.mode == 'badge-promotion'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/test.mjs --badge-promotion
      - name: One additionally approved genuine pre-Round relief witness
        if: inputs.mode == 'badge-promotion-relief'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/test.mjs --badge-promotion-relief
      - name: Retained completed and failed native case receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: badge-observations-${{ matrix.shard }}
          path: |
            .out/badge-observations.json
            .out/badge-level10.json
            .out/last-result.json
          retention-days: 7
          if-no-files-found: error
