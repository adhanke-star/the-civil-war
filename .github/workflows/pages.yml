name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site (no build step; copy only what the game serves)
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html device.html reward.html manifest.webmanifest sw.js offline-manifest.js _site/
          cp -R src vendor _site/
          if [ -d assets ]; then cp -R assets _site/; fi
          touch _site/.nojekyll
          # sw.js importScripts offline-manifest.js and installs every file it lists; refuse a site missing any.
          node -e '
            const fs = require("fs"), vm = require("vm"), box = {};
            vm.runInNewContext(fs.readFileSync("_site/offline-manifest.js", "utf8"), { self: box });
            const m = Object.values(box)[0];
            const missing = Object.keys(m.files).filter((p) => !fs.existsSync("_site/" + p));
            if (missing.length) { console.error("missing from _site:", missing); process.exit(1); }
            console.log("site has all", Object.keys(m.files).length, "offline files");
          '

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
