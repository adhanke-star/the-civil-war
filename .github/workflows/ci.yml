name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned current-field comparison
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin 4f6113a624e0e533825c0be414bb36f3b073f726
          test "$(git rev-parse FETCH_HEAD)" = "4f6113a624e0e533825c0be414bb36f3b073f726"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e 4f6113a624e0e533825c0be414bb36f3b073f726:src/main.js
          git cat-file -e 4f6113a624e0e533825c0be414bb36f3b073f726:src/entry.js

      - name: Fetch pinned reinforcement comparison
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin aaf10145531130f3ec201d6332f6759599bc46a4
          test "$(git rev-parse FETCH_HEAD)" = "aaf10145531130f3ec201d6332f6759599bc46a4"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e aaf10145531130f3ec201d6332f6759599bc46a4:src/main.js
          node tools/test-surrender-runtime.mjs --verify-legacy-game

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Prior sandbox sequence diagnostic only (not full acceptance)
        run: node tools/test.mjs --sandbox

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: .out/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
