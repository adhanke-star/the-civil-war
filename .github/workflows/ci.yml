name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host --init
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned current-field comparison
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin 4f6113a624e0e533825c0be414bb36f3b073f726
          test "$(git rev-parse FETCH_HEAD)" = "4f6113a624e0e533825c0be414bb36f3b073f726"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e 4f6113a624e0e533825c0be414bb36f3b073f726:src/main.js
          git cat-file -e 4f6113a624e0e533825c0be414bb36f3b073f726:src/entry.js

      - name: Fetch pinned reinforcement comparison
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin aaf10145531130f3ec201d6332f6759599bc46a4
          test "$(git rev-parse FETCH_HEAD)" = "aaf10145531130f3ec201d6332f6759599bc46a4"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e aaf10145531130f3ec201d6332f6759599bc46a4:src/main.js
          node tools/test-surrender-runtime.mjs --verify-legacy-game

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Verify pinned Playwright runtime
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const lock = JSON.parse(fs.readFileSync('package-lock.json'));
          const installed = JSON.parse(fs.readFileSync('node_modules/playwright/package.json'));
          assert.equal(lock.packages['node_modules/playwright'].version, '1.63.0');
          assert.equal(installed.version, '1.63.0');
          assert.equal(process.env.PLAYWRIGHT_BROWSERS_PATH, '/ms-playwright');
          const executable = chromium.executablePath();
          assert.ok(executable.startsWith('/ms-playwright/'));
          fs.accessSync(executable, fs.constants.X_OK);
          console.log(JSON.stringify({ playwright: installed.version, executable, bakedDependencies: true }));
          NODE

      - run: node tools/test-deployment.mjs
      - run: node tools/test-deployment.mjs --prove-fail

      - run: node tools/test-phase.mjs
      - run: node tools/test-phase.mjs --prove-fail

      - run: node tools/test-field-admission.mjs
      - run: node tools/test-field-admission.mjs --prove-fail

      - run: node tools/test-reinforcements.mjs
      - run: node tools/test-reinforcements.mjs --prove-fail

      - run: node tools/test-reinforcement-runtime.mjs
      - run: node tools/test-reinforcement-runtime.mjs --prove-fail

      - run: node tools/test-capture-accounting.mjs
      - run: node tools/test-capture-accounting.mjs --prove-fail

      - run: node tools/test-surrender-runtime.mjs
      - run: node tools/test-surrender-runtime.mjs --prove-fail

      - run: node tools/test-surrender-result.mjs
      - run: node tools/test-surrender-result.mjs --prove-fail
      - run: node tools/test-surrender-result-ui.mjs
      - run: node tools/test-surrender-result-ui.mjs --prove-fail

      - run: node tools/test-equipment.mjs
      - run: node tools/test-equipment.mjs --prove-fail

      - run: node tools/test-reward.mjs

      - run: node tools/test-reward.mjs --prove-fail
      - run: node tools/test-save.mjs
      - run: node tools/test-save.mjs --prove-fail

      - run: node tools/test-practice.mjs

      - run: node tools/test-practice.mjs --prove-fail
      - run: node tools/test-captures.mjs
      - run: node tools/test-captures.mjs --prove-fail
      - run: node tools/test-intro.mjs
      - run: node tools/test-intro.mjs --prove-fail
      - run: node tools/test-sandbox-rules.mjs
      - run: node tools/test-sandbox-rules.mjs --prove-fail
      - run: node tools/test-look.mjs
      - run: node tools/test-look.mjs --prove-fail
      - run: node tools/test-view.mjs
      - run: node tools/test-view.mjs --prove-fail
      - run: node tools/test-spacing.mjs
      - run: node tools/test-spacing.mjs --prove-fail
      - run: node tools/test-residency.mjs
      - run: node tools/test-residency.mjs --prove-fail
      - run: node tools/test-moments.mjs
      - run: node tools/test-moments.mjs --prove-fail
      - run: node tools/test-keyboard.mjs
      - run: node tools/test-keyboard.mjs --prove-fail

      - run: node tools/test-soldier-view.mjs
      - run: node tools/test-soldier-view.mjs --prove-fail

      - run: npm test

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: .out/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
