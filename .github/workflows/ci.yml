name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned current-field comparison
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin 4f6113a624e0e533825c0be414bb36f3b073f726
          test "$(git rev-parse FETCH_HEAD)" = "4f6113a624e0e533825c0be414bb36f3b073f726"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e 4f6113a624e0e533825c0be414bb36f3b073f726:src/main.js
          git cat-file -e 4f6113a624e0e533825c0be414bb36f3b073f726:src/entry.js

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: node tools/test-deployment.mjs
      - run: node tools/test-deployment.mjs --prove-fail

      - run: node tools/test-phase.mjs
      - run: node tools/test-phase.mjs --prove-fail

      - run: node tools/test-field-admission.mjs
      - run: node tools/test-field-admission.mjs --prove-fail

      - run: node tools/test-equipment.mjs
      - run: node tools/test-equipment.mjs --prove-fail

      - run: node tools/test-reward.mjs

      - run: node tools/test-reward.mjs --prove-fail
      - run: node tools/test-save.mjs
      - run: node tools/test-save.mjs --prove-fail

      - run: node tools/test-practice.mjs

      - run: node tools/test-practice.mjs --prove-fail
      - run: node tools/test-captures.mjs
      - run: node tools/test-captures.mjs --prove-fail
      - run: node tools/test-intro.mjs
      - run: node tools/test-intro.mjs --prove-fail
      - run: node tools/test-sandbox-rules.mjs
      - run: node tools/test-sandbox-rules.mjs --prove-fail
      - run: node tools/test-look.mjs
      - run: node tools/test-look.mjs --prove-fail
      - run: node tools/test-view.mjs
      - run: node tools/test-view.mjs --prove-fail
      - run: node tools/test-spacing.mjs
      - run: node tools/test-spacing.mjs --prove-fail
      - run: node tools/test-residency.mjs
      - run: node tools/test-residency.mjs --prove-fail
      - run: node tools/test-moments.mjs
      - run: node tools/test-moments.mjs --prove-fail
      - run: node tools/test-keyboard.mjs
      - run: node tools/test-keyboard.mjs --prove-fail

      - run: node tools/test-soldier-view.mjs
      - run: node tools/test-soldier-view.mjs --prove-fail

      - run: npm test

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: .out/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
