name: Reward focus warning causal trace (private)
on:
  push:
    branches: [reward-focus-inputs-private]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host --init
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /__w/the-civil-war/the-civil-war
      REWARD_FOCUS_WARNING_DIAGNOSTIC_AUTHORIZATION: autonomous-v1-causal-diagnostic
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Bind exact retained source parents
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/reward-focus-inputs-private"
          test "$GITHUB_WORKSPACE" = "/__w/the-civil-war/the-civil-war"
          test "$(realpath "$GITHUB_WORKSPACE")" = "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for task_parent in 002f0242079021a4341d701b4129ca4d7b8400e2 e65bab6d8b86e1dee06dec201ba051e85130f54b 7287296ae3b1c90f3a43642f33e3e886e8b889e2; do
            git fetch --no-tags --depth=1 origin "$task_parent"
            test "$(git rev-parse FETCH_HEAD)" = "$task_parent"
            git cat-file -e "$task_parent:src/reward/sequence.js"
          done
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - name: Retain complete runtime setup streams
        run: |
          set -euo pipefail
          mkdir .out
          node tools/test-reward-focus-private.mjs --warning-causal-capture setup
      - name: Trace four isolated pointer processes in control trace trace control order
        id: observe
        run: |
          set -euo pipefail
          node tools/test-reward-focus-private.mjs --warning-causal-capture collect
      - name: Bind complete causal forensic envelope
        if: always()
        id: pack
        run: node tools/test-reward-focus-private.mjs --warning-causal-pack
      - name: Retain bounded causal proof
        if: always() && steps.pack.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: reward-focus-warning-causal
          path: |
            .out/warning-causal-envelope.cwproof
            .out/warning-causal-metadata.json
            .out/warning-causal-source.json
          include-hidden-files: true
          retention-days: 7
          compression-level: 6
      - name: Preserve failed causal forensic evidence
        if: always() && steps.pack.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: reward-focus-warning-causal-failure
          path: .out/
          include-hidden-files: true
          retention-days: 7
          compression-level: 6
          if-no-files-found: warn
