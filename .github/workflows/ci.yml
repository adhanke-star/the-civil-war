name: Original suite CPU profile (private only)
on:
  push:
    branches: [reward-focus-inputs-private]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host --init
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /__w/the-civil-war/the-civil-war
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Bind diagnostic and immutable product source
        run: |
          test "$GITHUB_REF" = "refs/heads/reward-focus-inputs-private"
          test "$GITHUB_WORKSPACE" = "/__w/the-civil-war/the-civil-war"
          test "$(realpath "$GITHUB_WORKSPACE")" = "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e .out
          mkdir .out
          cp tools/test-reward-focus-private.mjs .out/cpu-profile-private-runner.mjs
          git fetch --no-tags --depth=1 origin 2bac1ccd575c400629dec23df2f37fefb09f8b6e
          test "$(git rev-parse FETCH_HEAD)" = "2bac1ccd575c400629dec23df2f37fefb09f8b6e"
          git checkout --detach 2bac1ccd575c400629dec23df2f37fefb09f8b6e
          test "$(git rev-parse HEAD)" = "2bac1ccd575c400629dec23df2f37fefb09f8b6e"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - name: Fetch pinned current-field comparison
        run: |
          test "$GITHUB_WORKSPACE" = "/__w/the-civil-war/the-civil-war"
          test "$(realpath "$GITHUB_WORKSPACE")" = "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "2bac1ccd575c400629dec23df2f37fefb09f8b6e"
          git fetch --no-tags --depth=1 origin 4f6113a624e0e533825c0be414bb36f3b073f726
          test "$(git rev-parse FETCH_HEAD)" = "4f6113a624e0e533825c0be414bb36f3b073f726"
          test "$(git rev-parse HEAD)" = "2bac1ccd575c400629dec23df2f37fefb09f8b6e"
          git cat-file -e 4f6113a624e0e533825c0be414bb36f3b073f726:src/main.js
          git cat-file -e 4f6113a624e0e533825c0be414bb36f3b073f726:src/entry.js

      - name: Fetch pinned reinforcement comparison
        run: |
          test "$(git rev-parse HEAD)" = "2bac1ccd575c400629dec23df2f37fefb09f8b6e"
          git fetch --no-tags --depth=1 origin aaf10145531130f3ec201d6332f6759599bc46a4
          test "$(git rev-parse FETCH_HEAD)" = "aaf10145531130f3ec201d6332f6759599bc46a4"
          test "$(git rev-parse HEAD)" = "2bac1ccd575c400629dec23df2f37fefb09f8b6e"
          git cat-file -e aaf10145531130f3ec201d6332f6759599bc46a4:src/main.js
          node tools/test-surrender-runtime.mjs --verify-legacy-game

      - name: Fetch pinned captured-gun comparison
        run: |
          test "$(git rev-parse HEAD)" = "2bac1ccd575c400629dec23df2f37fefb09f8b6e"
          git fetch --no-tags --depth=1 origin b81dad641ff86c7586b13abf57dce257e299fef0
          test "$(git rev-parse FETCH_HEAD)" = "b81dad641ff86c7586b13abf57dce257e299fef0"
          test "$(git rev-parse HEAD)" = "2bac1ccd575c400629dec23df2f37fefb09f8b6e"
          git cat-file -e b81dad641ff86c7586b13abf57dce257e299fef0:src/units/battery.js
          git cat-file -e b81dad641ff86c7586b13abf57dce257e299fef0:src/game.js

      - name: Fetch pinned battery-overrun comparison
        run: |
          test "$(git rev-parse HEAD)" = "2bac1ccd575c400629dec23df2f37fefb09f8b6e"
          git fetch --no-tags --depth=1 origin 0e505fd61dead1f95659eaa2f8652f31935a50bc
          test "$(git rev-parse FETCH_HEAD)" = "0e505fd61dead1f95659eaa2f8652f31935a50bc"
          test "$(git rev-parse HEAD)" = "2bac1ccd575c400629dec23df2f37fefb09f8b6e"
          git cat-file -e 0e505fd61dead1f95659eaa2f8652f31935a50bc:src/game.js
          git cat-file -e 0e505fd61dead1f95659eaa2f8652f31935a50bc:src/sim/combat.js
          git cat-file -e 0e505fd61dead1f95659eaa2f8652f31935a50bc:src/sim/phase.js

      - name: Fetch pinned captured-loadout comparison
        run: |
          test "$(git rev-parse HEAD)" = "2bac1ccd575c400629dec23df2f37fefb09f8b6e"
          git fetch --no-tags --depth=1 origin 158cb60a1dd26e84161fcdc97342d7f239369f90
          test "$(git rev-parse FETCH_HEAD)" = "158cb60a1dd26e84161fcdc97342d7f239369f90"
          test "$(git rev-parse HEAD)" = "2bac1ccd575c400629dec23df2f37fefb09f8b6e"
          git cat-file -e 158cb60a1dd26e84161fcdc97342d7f239369f90:src/franchise/practice.js
          git cat-file -e 158cb60a1dd26e84161fcdc97342d7f239369f90:tools/test-battery-overrun.mjs
          git cat-file -e 158cb60a1dd26e84161fcdc97342d7f239369f90:tools/test-captured-guns.mjs

      - name: Fetch pinned reward-focus comparison
        run: |
          test "$(git rev-parse HEAD)" = "2bac1ccd575c400629dec23df2f37fefb09f8b6e"
          git fetch --no-tags --depth=1 origin 7287296ae3b1c90f3a43642f33e3e886e8b889e2
          test "$(git rev-parse FETCH_HEAD)" = "7287296ae3b1c90f3a43642f33e3e886e8b889e2"
          test "$(git rev-parse HEAD)" = "2bac1ccd575c400629dec23df2f37fefb09f8b6e"
          git cat-file -e 7287296ae3b1c90f3a43642f33e3e886e8b889e2:src/reward/sequence.js
          git cat-file -e 7287296ae3b1c90f3a43642f33e3e886e8b889e2:src/reward/reward.css
          git cat-file -e 7287296ae3b1c90f3a43642f33e3e886e8b889e2:tools/test-captured-loadouts.mjs

      - name: Observe unchanged original suite CPU and processes
        id: profile
        run: node .out/cpu-profile-private-runner.mjs
      - name: Preserve complete private diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-profile-private-diagnostic
          path: |
            .out/cpu-profile-private-runner.mjs
            .out/cpu-profile-private-actual.json
          include-hidden-files: true
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
      - name: Preserve all original producer files with native proof
        if: always() && steps.profile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cpu-profile-original-output
          path: |
            .out/
            !.out/last-result.json
            !.out/cpu-profile-private-runner.mjs
            !.out/cpu-profile-private-actual.json
          include-hidden-files: true
          retention-days: 7
          compression-level: 6
          if-no-files-found: warn
      - name: Preserve all original producer failure files
        if: always() && steps.profile.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cpu-profile-original-failure-output
          path: |
            .out/
            !.out/cpu-profile-private-runner.mjs
            !.out/cpu-profile-private-actual.json
          include-hidden-files: true
          retention-days: 7
          compression-level: 6
          if-no-files-found: warn
