          test "$(git rev-parse FETCH_HEAD)" = "0e505fd61dead1f95659eaa2f8652f31935a50bc"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e 0e505fd61dead1f95659eaa2f8652f31935a50bc:src/game.js
          git cat-file -e 0e505fd61dead1f95659eaa2f8652f31935a50bc:src/sim/combat.js
          git cat-file -e 0e505fd61dead1f95659eaa2f8652f31935a50bc:src/sim/phase.js

      - name: Fetch pinned probe captured-loadout comparison
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin 158cb60a1dd26e84161fcdc97342d7f239369f90
          test "$(git rev-parse FETCH_HEAD)" = "158cb60a1dd26e84161fcdc97342d7f239369f90"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
