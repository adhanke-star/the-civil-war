name: F6c soldier timeout timing diagnostic
on:
  push:
    branches: [p3f6c-timeout-diagnosis]
permissions:
  contents: read
jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host --init
    env:
      GIT_CONFIG_COUNT: '4'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /__w/the-civil-war/the-civil-war
      GIT_CONFIG_KEY_1: safe.directory
      GIT_CONFIG_VALUE_1: /__w/the-civil-war/soldier-timeout-A
      GIT_CONFIG_KEY_2: safe.directory
      GIT_CONFIG_VALUE_2: /__w/the-civil-war/soldier-timeout-B
      GIT_CONFIG_KEY_3: safe.directory
      GIT_CONFIG_VALUE_3: /__w/the-civil-war/soldier-timeout-A2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact diagnostic input and historical source pins
        run: |
          test "$GITHUB_REF" = "refs/heads/p3f6c-timeout-diagnosis"
          test "$GITHUB_WORKSPACE" = "/__w/the-civil-war/the-civil-war"
          test "$(realpath "$GITHUB_WORKSPACE")" = "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for proof_sha in 158cb60a1dd26e84161fcdc97342d7f239369f90 7287296ae3b1c90f3a43642f33e3e886e8b889e2 4f6113a624e0e533825c0be414bb36f3b073f726 aaf10145531130f3ec201d6332f6759599bc46a4 b81dad641ff86c7586b13abf57dce257e299fef0 0e505fd61dead1f95659eaa2f8652f31935a50bc; do
            git fetch --no-tags --depth=1 origin "$proof_sha"
            test "$(git rev-parse FETCH_HEAD)" = "$proof_sha"
            git cat-file -e "$proof_sha:tools/test.mjs"
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - name: Exact A B A2 soldier source timing
        run: node tools/diagnose-f6c-timeout.mjs
      - name: Retain complete soldier diagnosis outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f6c-soldier-timeout-diagnostic
          path: |
            .out/
            /__w/the-civil-war/soldier-timeout-A/.out/
            /__w/the-civil-war/soldier-timeout-B/.out/
            /__w/the-civil-war/soldier-timeout-A2/.out/
          include-hidden-files: true
          retention-days: 7
          compression-level: 6
