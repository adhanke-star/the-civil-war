name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# The browser run is split into four parallel shards (tools/test.mjs --shard=N) so each job stays well
# under the 45-minute cap. The probes job runs every Node/CPU behaviour file and its --prove-fail controls.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host --init
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm

      - run: npm ci

      - name: Verify pinned Playwright runtime
        run: |
          node --input-type=module -e "
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const lock = JSON.parse(fs.readFileSync('package-lock.json'));
          assert.equal(lock.packages['node_modules/playwright'].version, '1.63.0');
          assert.equal(JSON.parse(fs.readFileSync('node_modules/playwright/package.json')).version, '1.63.0');
          fs.accessSync(chromium.executablePath(), fs.constants.X_OK);
          console.log('playwright 1.63.0', chromium.executablePath());
          "

      - name: Browser checks (shard ${{ matrix.shard }} of 4)
        run: node tools/test.mjs --shard=${{ matrix.shard }}

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.shard }}
          path: .out/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  probes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host --init
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm

      - run: npm ci

      - name: Node behaviour files and their --prove-fail controls
        run: |
          set -euo pipefail
          for name in deployment phase field-admission reinforcements reinforcement-runtime capture-accounting \
            surrender-runtime surrender-result surrender-result-ui equipment reward save practice captures intro \
            sandbox-rules look view spacing residency moments keyboard soldier-view surrender-activation \
            captured-guns battery-overrun captured-loadouts packs large ai masking campaign campaign-ui ground delegation shiloh command stones-river \
            cavalry chattanooga economy badges observe-badges orders history audio art hooks traits command-chain current-compression scene-allocation foragers progression difficulty-matrix inactive-figures terrain-partition terrain-owner pool-resource game-figure-resource runtime-close level-rewards atlas-compression atlas-loader; do
            for mode in "" --prove-fail; do
              echo "::group::node tools/test-$name.mjs $mode"
              node "tools/test-$name.mjs" $mode
              echo "::endgroup::"
            done
          done

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-output
          path: .out/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  # P7: the same game in Firefox and WebKit (Safari's engine): title, Continue, first and last campaign phases.
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit, offline]
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host --init
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm

      - run: npm ci

      - name: Smoke run in ${{ matrix.browser }}
        # Firefox refuses to start when $HOME is not owned by the container user
        env:
          HOME: /root
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          if [ "${{ matrix.browser }}" = offline ]; then
            # the service worker: a battle visited once plays with the network off
            node tools/test-offline.mjs
          elif [ "${{ matrix.browser }}" = firefox ]; then
            # headless Firefox has no GL driver in this container: Mesa's software GL under xvfb instead
            apt-get update -qq && apt-get install -y -qq libgl1-mesa-dri libegl1 libegl-mesa0 xvfb >/dev/null
            xvfb-run -a -s "-screen 0 1280x720x24" node tools/test-browsers.mjs --browser=firefox --headed
          else
            node tools/test-browsers.mjs --browser=${{ matrix.browser }}
          fi

      - name: Upload browser output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browsers-${{ matrix.browser }}
          path: .out/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  # P7: the agent playthrough: the whole campaign through the real UI, a defeat and its replay, reload, export/import.
  playthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host --init
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm

      - run: npm ci

      - name: Play the campaign
        env:
          HOME: /root
        run: node tools/test-playthrough.mjs --ff-budget=180 --deadline=70

      - name: Upload playthrough output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playthrough
          path: .out/playthrough/
          retention-days: 7
          if-no-files-found: warn
