name: Reward focus GPU path benchmark (private only)
on:
  push:
    branches: [reward-focus-inputs-private]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host --init
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /__w/the-civil-war/the-civil-war
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Bind diagnostic and immutable product source
        run: |
          test "$GITHUB_REF" = "refs/heads/reward-focus-inputs-private"
          test "$GITHUB_WORKSPACE" = "/__w/the-civil-war/the-civil-war"
          test "$(realpath "$GITHUB_WORKSPACE")" = "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e .out
          mkdir .out
          cp tools/test-reward-focus-private.mjs .out/gpu-path-private-runner.mjs
          git fetch --no-tags --depth=1 origin 2bac1ccd575c400629dec23df2f37fefb09f8b6e
          test "$(git rev-parse FETCH_HEAD)" = "2bac1ccd575c400629dec23df2f37fefb09f8b6e"
          git checkout --detach 2bac1ccd575c400629dec23df2f37fefb09f8b6e
          test "$(git rev-parse HEAD)" = "2bac1ccd575c400629dec23df2f37fefb09f8b6e"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - name: Four serial real-field rendering measurements
        run: node .out/gpu-path-private-runner.mjs
      - name: Preserve complete private diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-path-private-diagnostic
          path: |
            .out/gpu-path-private-runner.mjs
            .out/gpu-path-private-actual.json
          include-hidden-files: true
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
