# Art bake probe: build a Union infantryman in headless Blender (MPFB2 body + scripted uniform),
# key poses, render sprite frames with baked light and shadow, pack atlases. The artifact is the
# result (7-day retention); nothing is committed from this workflow. See tools/bake/README.md.
#
# Third pass: three jobs.
#   prep    builds the soldier once (probe, uniform, poses) and hands work/posed.blend on
#   render  a matrix of shards renders in parallel (hero/head/hand shots; close tier by
#           direction; field tier + every field variant by direction); quick runs use one "all" shard
#   pack    merges the shards' frames and reports into atlases, manifest, contact sheet, previews
name: Bake

on:
  workflow_dispatch:
    inputs:
      samples_close:
        description: Cycles samples for the 256 px close tier
        default: '32'
      samples_field:
        description: Cycles samples for the 96 px field tier
        default: '16'
      samples_hero:
        description: Cycles samples for the 1024 px hero render
        default: '96'
      directions:
        description: Yaw directions
        default: '16'
      elevation:
        description: Camera elevation in degrees above horizontal
        default: '35'
      quick:
        description: '1 = quick check set (one shard: hero, portrait, hands, heads, a few frames) instead of the full matrix'
        default: '0'
  push:
    branches: [bake]
    paths:
      - 'tools/bake/**'
      - '.github/workflows/bake.yml'

permissions:
  contents: read

concurrency:
  group: bake-${{ github.ref }}
  cancel-in-progress: true

env:
  BLENDER_VERSION: '4.2.23'
  BLENDER_SHA256: bea0eb3146be13eae6225409a117b215184f41b7f79e799f97cb3abb8f6dc404
  MPFB_REF: v2.0.17
  MH_ASSETS_URL: https://files.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip
  MH_ASSETS_FILE: makehuman_system_assets_cc0.zip
  # CC0 beards and moustaches (page: https://static.makehumancommunity.org/assets/assetpacks/bodyparts05.html)
  BEARD_URL: https://files.makehumancommunity.org/asset_packs/bodyparts05/bodyparts05_cc0.zip
  BEARD_URL2: https://files2.makehumancommunity.org/asset_packs/bodyparts05/bodyparts05_cc0.zip
  BEARD_FILE: bodyparts05_cc0.zip
  BAKE_OUT: ${{ github.workspace }}/.out/bake
  SAMPLES_CLOSE: ${{ inputs.samples_close || '32' }}
  SAMPLES_FIELD: ${{ inputs.samples_field || '16' }}
  SAMPLES_HERO: ${{ inputs.samples_hero || '96' }}
  DIRECTIONS: ${{ inputs.directions || '16' }}
  ELEVATION: ${{ inputs.elevation || '35' }}
  # push runs: put [quick] in the commit message for the quick check set
  QUICK: ${{ inputs.quick || (contains(github.event.head_commit.message, '[quick]') && '1') || '0' }}
  # full run: 1 hero shard + 16 close-tier shards + 3 field-tier shards. Each tier renders the base
  # figure and every variant; a shard takes the (variant, direction) units with index % n == k.
  SHARDS_FULL: '["hero","c0of16","c1of16","c2of16","c3of16","c4of16","c5of16","c6of16","c7of16","c8of16","c9of16","c10of16","c11of16","c12of16","c13of16","c14of16","c15of16","f0of3","f1of3","f2of3"]'

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Prepare output and print runner
        run: |
          mkdir -p "$BAKE_OUT"
          : > "$BAKE_OUT/timing.tsv"
          echo "cpus: $(nproc)"; free -g; df -h "$GITHUB_WORKSPACE"

      - name: Cache Blender tarball
        id: blender-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/dl/blender-${{ env.BLENDER_VERSION }}-linux-x64.tar.xz
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender (download.blender.org first, official mirrors if blocked)
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/dl
          f=~/dl/blender-${BLENDER_VERSION}-linux-x64.tar.xz
          for base in https://download.blender.org/release https://mirrors.ocf.berkeley.edu/blender/release https://ftp.nluug.nl/pub/graphics/blender/release; do
            url="$base/Blender4.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
            echo "trying $url"
            if curl -fsSL --retry 3 --retry-delay 5 -o "$f" "$url" && echo "${BLENDER_SHA256}  $f" | sha256sum -c -; then
              echo "downloaded from $url"
              printf 'download blender (%s)\t%s\tok\n' "$base" "$SECONDS" >> "$BAKE_OUT/timing.tsv"
              exit 0
            fi
            rm -f "$f"
          done
          exit 1

      - name: Unpack Blender
        run: |
          f=~/dl/blender-${BLENDER_VERSION}-linux-x64.tar.xz
          echo "${BLENDER_SHA256}  $f" | sha256sum -c -
          mkdir -p ~/blender && tar -xf "$f" -C ~/blender
          B=~/blender/blender-${BLENDER_VERSION}-linux-x64/blender
          echo "BLENDER=$B" >> "$GITHUB_ENV"
          if ! "$B" -b --factory-startup -noaudio --version; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 libice6 libx11-6
            "$B" -b --factory-startup -noaudio --version
          fi
          printf 'unpack blender\t%s\tok\n' "$SECONDS" >> "$BAKE_OUT/timing.tsv"

      - name: Cache MakeHuman system assets (CC0)
        id: mh-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/dl/${{ env.MH_ASSETS_FILE }}
          key: mh-system-assets-cc0-2024-04-14

      - name: Download MakeHuman system assets (CC0)
        if: steps.mh-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/dl
          curl -fsSL --retry 3 --retry-delay 5 -o ~/dl/$MH_ASSETS_FILE "$MH_ASSETS_URL"
          ls -l ~/dl/$MH_ASSETS_FILE
          printf 'download MakeHuman CC0 assets\t%s\tok\n' "$SECONDS" >> "$BAKE_OUT/timing.tsv"

      - name: Cache MakeHuman bodyparts05 beard pack (CC0)
        id: beard-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/dl/${{ env.BEARD_FILE }}
          key: mh-bodyparts05-cc0-2024-04-14

      - name: Download MakeHuman bodyparts05 beard pack (CC0, head presets)
        if: steps.beard-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/dl
          curl -fsSL --retry 3 --retry-delay 5 -o ~/dl/$BEARD_FILE "$BEARD_URL" \
            || curl -fsSL --retry 3 --retry-delay 5 -o ~/dl/$BEARD_FILE "$BEARD_URL2" || rm -f ~/dl/$BEARD_FILE
          ls -l ~/dl/ || true

      - name: Fetch MPFB2 source (GPL add-on, used as a tool)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: makehumancommunity/mpfb2
          ref: ${{ env.MPFB_REF }}
          path: _mpfb2
          sparse-checkout: src/mpfb
          persist-credentials: false

      - name: Install MPFB2 as a Blender extension
        run: |
          set +e
          cd _mpfb2/src/mpfb && zip -qr "$RUNNER_TEMP/mpfb.zip" . -x '*__pycache__*' && cd "$GITHUB_WORKSPACE"
          ls -l "$RUNNER_TEMP/mpfb.zip"
          "$BLENDER" --command extension install-file -r user_default -e "$RUNNER_TEMP/mpfb.zip"
          rc=$?
          echo "extension install-file exit $rc"
          printf 'install MPFB2 extension\t%s\t%s\n' "$SECONDS" "$([ $rc = 0 ] && echo ok || echo "cli exit $rc (probe retries)")" >> "$BAKE_OUT/timing.tsv"
          exit 0

      - name: 1 probe_mpfb.py (MPFB2 human, default rig, CC0 head presets)
        run: |
          set +e
          "$BLENDER" -b --factory-startup -noaudio --python-exit-code 1 -P tools/bake/probe_mpfb.py -- \
            --out "$BAKE_OUT" --assets-zip ~/dl/$MH_ASSETS_FILE --mpfb-zip "$RUNNER_TEMP/mpfb.zip" \
            --mpfb-src "$GITHUB_WORKSPACE/_mpfb2/src/mpfb" --beard-zip ~/dl/$BEARD_FILE
          rc=$?
          printf 'probe_mpfb.py\t%s\t%s\n' "$SECONDS" "$([ $rc = 0 ] && echo ok || echo "FAIL $rc")" >> "$BAKE_OUT/timing.tsv"
          exit $rc

      - name: 2 uniform.py (Union private, 1862)
        run: |
          set +e
          "$BLENDER" -b --factory-startup -noaudio --python-exit-code 1 -P tools/bake/uniform.py -- --out "$BAKE_OUT"
          rc=$?
          printf 'uniform.py\t%s\t%s\n' "$SECONDS" "$([ $rc = 0 ] && echo ok || echo "FAIL $rc")" >> "$BAKE_OUT/timing.tsv"
          exit $rc

      - name: 3 poses.py (stand, walk, fire, fallen, load; grip solve)
        run: |
          set +e
          "$BLENDER" -b --factory-startup -noaudio --python-exit-code 1 -P tools/bake/poses.py -- --out "$BAKE_OUT"
          rc=$?
          printf 'poses.py\t%s\t%s\n' "$SECONDS" "$([ $rc = 0 ] && echo ok || echo "FAIL $rc")" >> "$BAKE_OUT/timing.tsv"
          exit $rc

      - name: 3b cloth.py (settle the cloth per pose; never fails the job)
        run: |
          set +e
          "$BLENDER" -b --factory-startup -noaudio --python-exit-code 1 -P tools/bake/cloth.py -- --out "$BAKE_OUT" --budget-min 14
          rc=$?
          printf 'cloth.py\t%s\t%s\n' "$SECONDS" "$([ $rc = 0 ] && echo ok || echo "FAIL $rc (armature-posed cloth kept)")" >> "$BAKE_OUT/timing.tsv"
          exit 0

      - name: Plan the render shards
        id: plan
        run: |
          if [ "$QUICK" = "1" ]; then s='["all"]'; else s="$SHARDS_FULL"; fi
          echo "shards=$s" >> "$GITHUB_OUTPUT"
          echo "shards: $s"
          ls -l "$BAKE_OUT/work"

      - name: Hand the posed soldier to the render jobs (1 day)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: work-${{ github.run_number }}
          path: .out/bake/work/posed.blend
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

      - name: Upload prep reports (also when a stage fails)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports-${{ github.run_number }}
          path: |
            .out/bake/report/
            .out/bake/timing.tsv
          retention-days: 7
          if-no-files-found: warn

  render:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prep.outputs.shards) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Prepare output
        run: |
          mkdir -p "$BAKE_OUT/work"
          echo "cpus: $(nproc)"; free -g

      - name: Cache Blender tarball
        id: blender-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/dl/blender-${{ env.BLENDER_VERSION }}-linux-x64.tar.xz
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender (cache miss only)
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/dl
          f=~/dl/blender-${BLENDER_VERSION}-linux-x64.tar.xz
          for base in https://download.blender.org/release https://mirrors.ocf.berkeley.edu/blender/release https://ftp.nluug.nl/pub/graphics/blender/release; do
            if curl -fsSL --retry 3 --retry-delay 5 -o "$f" "$base/Blender4.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz" && echo "${BLENDER_SHA256}  $f" | sha256sum -c -; then exit 0; fi
            rm -f "$f"
          done
          exit 1

      - name: Unpack Blender
        run: |
          f=~/dl/blender-${BLENDER_VERSION}-linux-x64.tar.xz
          echo "${BLENDER_SHA256}  $f" | sha256sum -c -
          mkdir -p ~/blender && tar -xf "$f" -C ~/blender
          B=~/blender/blender-${BLENDER_VERSION}-linux-x64/blender
          echo "BLENDER=$B" >> "$GITHUB_ENV"
          if ! "$B" -b --factory-startup -noaudio --version; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 libice6 libx11-6
            "$B" -b --factory-startup -noaudio --version
          fi

      - name: Fetch the posed soldier
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: work-${{ github.run_number }}
          path: .out/bake/work

      - name: Fetch the prep reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: reports-${{ github.run_number }}
          path: .out/bake

      - name: 4 render.py shard ${{ matrix.shard }}
        timeout-minutes: 36
        run: |
          set +e
          start=$SECONDS
          "$BLENDER" -b --factory-startup -noaudio --python-exit-code 1 -P tools/bake/render.py -- --out "$BAKE_OUT" \
            --samples-close "$SAMPLES_CLOSE" --samples-field "$SAMPLES_FIELD" --samples-hero "$SAMPLES_HERO" \
            --directions "$DIRECTIONS" --elevation "$ELEVATION" --quick "$QUICK" --shard "${{ matrix.shard }}" 2>&1 \
            | grep -v -E '^Fra:|^Saved:|^ Time:|^$'
          rc=${PIPESTATUS[0]}
          printf 'render.py %s\t%s\t%s\n' "${{ matrix.shard }}" "$((SECONDS - start))" "$([ $rc = 0 ] && echo ok || echo "FAIL $rc")" > "$BAKE_OUT/timing-${{ matrix.shard }}.tsv"
          rm -f "$BAKE_OUT/timing.tsv"
          exit $rc

      - name: Upload the shard (1 day)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shard-${{ github.run_number }}-${{ matrix.shard }}
          path: |
            .out/bake/
            !.out/bake/work/**
          retention-days: 1
          if-no-files-found: warn

  pack:
    needs: [prep, render]
    if: always() && needs.prep.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install Node deps (pngjs is already a devDependency)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Fetch every shard
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: shard-${{ github.run_number }}-*
          merge-multiple: true
          path: .out/bake

      - name: Fetch the prep reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: reports-${{ github.run_number }}
          path: .out/bake

      - name: 5 pack.mjs (merge shards, atlas, manifest, contact sheet, previews)
        run: |
          set +e
          start=$SECONDS
          node tools/bake/pack.mjs --out "$BAKE_OUT"
          rc=$?
          printf 'pack.mjs\t%s\t%s\n' "$((SECONDS - start))" "$([ $rc = 0 ] && echo ok || echo "FAIL $rc")" > "$BAKE_OUT/timing-pack.tsv"
          exit $rc

      - name: Job summary
        if: always()
        run: node tools/bake/pack.mjs --out "$BAKE_OUT" --summary >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bake output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bake-${{ github.run_number }}
          path: |
            .out/bake/
            !.out/bake/work/**
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

      - name: Upload preview (small; the images a person judges, plus reports)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-${{ github.run_number }}
          path: |
            .out/bake/contact-sheet.png
            .out/bake/hero-preview.png
            .out/bake/hero-closeup-preview.png
            .out/bake/portrait-preview.png
            .out/bake/hands-preview.png
            .out/bake/report/
            .out/bake/timing*.tsv
          retention-days: 7
          if-no-files-found: warn
